<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok login</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 16px;color:#111}
 textarea{width:100%;height:110px;font-family:monospace;font-size:13px;padding:8px;box-sizing:border-box}
 button{font-size:16px;padding:10px 18px;margin-top:10px;cursor:pointer}
 .ok{color:#0a7a2f}.err{color:#b00020}
 @media (prefers-color-scheme:dark){body{background:#121212;color:#eee}textarea{background:#1e1e1e;color:#eee}}
</style></head><body>
<h2>TikTok login</h2>
<p id="msg"></p>
<textarea id="url" readonly></textarea><br>
<button id="copy">Copy</button>
<p>Paste the copied text into the uploader window. This page only displays the address in your browser
and sends nothing anywhere.</p>
<script>
 var u = location.href, p = new URLSearchParams(location.search);
 document.getElementById('url').value = u;
 var m = document.getElementById('msg');
 if (p.get('code')) { m.className='ok'; m.textContent='Success. Copy the full address below.'; }
 else if (p.get('error')) { m.className='err'; m.textContent='TikTok reported: ' + (p.get('error_description')||p.get('error')); }
 else { m.textContent='This page is ready. Start the login from the uploader to see your code here.'; }
 document.getElementById('copy').onclick = function(){
   var t = document.getElementById('url'); t.select();
   (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.resolve(document.execCommand('copy')))
     .then(function(){ document.getElementById('copy').textContent='Copied'; });
 };
</script></body></html>
